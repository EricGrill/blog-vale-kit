# Fixture config. Same ignores as the template, plus the sample Example style.

MinAlertLevel = suggestion
StylesPath = ../styles

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Base, Example
Vocab = Base, Example
BlockIgnores = (?s) *(```.*?```), (?s) *(\{/\*.*?\*/\}), (?s) *(</?[A-Z][A-Za-z0-9.]*\b[^>]*>), (?m)^(?:import|export)\s.+$
TokenIgnores = (`[^`\n]*`), (</?[A-Za-z][^>\n]*>), (\{[^{}\n]*\})
