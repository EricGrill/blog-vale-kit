name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixtures:
    name: Fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run fixture tests
        run: bash scripts/test-fixtures.sh

  vale:
    name: Vale (warning-only)
    permissions:
      contents: read
    uses: ./.github/workflows/vale.yml
    with:
      fail_on_error: false
